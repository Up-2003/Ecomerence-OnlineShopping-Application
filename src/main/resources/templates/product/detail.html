<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${product.name})}"></head>
<body>

<nav th:replace="~{layout/base :: nav}"></nav>

<main class="container my-4">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
            <li class="breadcrumb-item"><a th:href="@{/products}">Products</a></li>
            <li class="breadcrumb-item active" th:text="${product.name}"></li>
        </ol>
    </nav>

    <div class="row">
        <div class="col-md-6">
            <img th:src="${product.imageUrl}" class="img-fluid rounded"
                 style="width: 100%; max-height: 500px; object-fit: cover;">
        </div>
        <div class="col-md-6">
            <h1 th:text="${product.name}"></h1>
            <p class="text-muted" th:text="${product.category?.name}"></p>
            <h2 class="text-primary my-3"
                th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}"></h2>

            <div class="mb-3">
                <span class="badge bg-success" th:if="${product.stock > 0}">
                    In Stock (<span th:text="${product.stock}"></span> available)
                </span>
                <span class="badge bg-danger" th:unless="${product.stock > 0}">
                    Out of Stock
                </span>
            </div>

            <p th:text="${product.description}"></p>

            <hr>

            <form th:action="@{/cart/add}" method="post" th:if="${product.stock > 0}">
                <input type="hidden" name="productId" th:value="${product.id}">
                <div class="row g-2 align-items-end">
                    <div class="col-auto">
                        <label class="form-label">Quantity</label>
                        <input type="number" name="quantity" value="1" min="1"
                               th:max="${product.stock}" class="form-control" style="width: 100px;">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-cart-plus"></i> Add to Cart
                        </button>
                    </div>
                </div>
            </form>

        </div>
    </div>

</main>

<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
