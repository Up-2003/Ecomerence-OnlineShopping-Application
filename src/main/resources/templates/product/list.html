<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Products')}"></head>
<body>

<nav th:replace="~{layout/base :: nav}"></nav>

<main class="container my-4">

    <div class="row">
        <!-- Sidebar -->
        <aside class="col-md-3">
            <div class="card mb-3">
                <div class="card-header"><strong>Categories</strong></div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <a th:href="@{/products}" class="text-decoration-none">All</a>
                    </li>
                    <li class="list-group-item" th:each="c : ${categories}">
                        <a th:href="@{/products/filter(categoryId=${c.id})}"
                           class="text-decoration-none"
                           th:classappend="${selectedCategoryId == c.id} ? 'fw-bold'"
                           th:text="${c.name}"></a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Products -->
        <div class="col-md-9">

            <!-- Sort -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Products</h3>
                <form method="get" th:action="@{/products}" class="d-flex">
                    <select name="sort" class="form-select form-select-sm" onchange="this.form.submit()">
                        <option value="newest" th:selected="${sort == 'newest'}">Newest</option>
                        <option value="price-asc" th:selected="${sort == 'price-asc'}">Price ↑</option>
                        <option value="price-desc" th:selected="${sort == 'price-desc'}">Price ↓</option>
                        <option value="name" th:selected="${sort == 'name'}">Name</option>
                    </select>
                </form>
            </div>

            <!-- Grid -->
            <div class="row">
                <div class="col-md-4 mb-4" th:each="p : ${products.content}">
                    <div class="card h-100">
                        <img th:src="${p.imageUrl}" class="card-img-top"
                             style="height: 180px; object-fit: cover;">
                        <div class="card-body d-flex flex-column">
                            <h6 th:text="${p.name}"></h6>
                            <p class="text-muted small"
                               th:text="${#strings.abbreviate(p.description, 50)}"></p>
                            <div class="mt-auto">
                                <div class="h5 text-primary mb-2"
                                     th:text="'$' + ${#numbers.formatDecimal(p.price, 1, 2)}"></div>
                                <a th:href="@{/products/{id}(id=${p.id})}"
                                   class="btn btn-primary btn-sm w-100">View</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <nav th:if="${products.totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/products(page=${products.number - 1})}">Previous</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                        th:classappend="${i == products.number} ? 'active'">
                        <a class="page-link"
                           th:href="@{/products(page=${i})}"
                           th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/products(page=${products.number + 1})}">Next</a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>

</main>

<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
