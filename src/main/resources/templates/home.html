<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Home')}"></head>
<body>

<nav th:replace="~{layout/base :: nav}"></nav>

<main class="container my-4">

    <!-- Hero -->
    <div class="p-5 mb-4 bg-primary text-white rounded-3">
        <h1 class="display-4 fw-bold">Welcome to ShopHub</h1>
        <p class="lead">Shop the best products at great prices</p>
        <a th:href="@{/products}" class="btn btn-light btn-lg">
            <i class="bi bi-bag"></i> Shop Now
        </a>
    </div>

    <!-- Categories -->
    <h2 class="mb-3">Categories</h2>
    <div class="row mb-5">
        <div class="col-md-3 mb-3" th:each="cat : ${categories}">
            <a th:href="@{/products/filter(categoryId=${cat.id})}"
               class="text-decoration-none">
                <div class="card h-100 text-center p-3">
                    <h5 th:text="${cat.name}">Category</h5>
                    <small class="text-muted" th:text="${cat.description}"></small>
                </div>
            </a>
        </div>
    </div>

    <!-- Featured Products -->
    <h2 class="mb-3">Featured Products</h2>
    <div class="row">
        <div class="col-md-3 mb-4" th:each="p : ${featuredProducts.content}">
            <div class="card h-100 product-card">
                <img th:src="${p.imageUrl}" class="card-img-top" alt="..."
                     style="height: 200px; object-fit: cover;">
                <div class="card-body d-flex flex-column">
                    <h6 class="card-title" th:text="${p.name}">Product</h6>
                    <p class="card-text text-muted small"
                       th:text="${#strings.abbreviate(p.description, 60)}"></p>
                    <div class="mt-auto">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="h5 text-primary"
                                  th:text="'$' + ${#numbers.formatDecimal(p.price, 1, 2)}"></span>
                            <small class="text-muted">
                                Stock: <span th:text="${p.stock}"></span>
                            </small>
                        </div>
                        <div class="d-grid gap-2">
                            <a th:href="@{/products/{id}(id=${p.id})}"
                               class="btn btn-outline-primary btn-sm">View</a>
                            <form th:action="@{/cart/add}" method="post">
                                <input type="hidden" name="productId" th:value="${p.id}">
                                <input type="hidden" name="quantity" value="1">
                                <button class="btn btn-primary btn-sm w-100">
                                    <i class="bi bi-cart-plus"></i> Add to Cart
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
